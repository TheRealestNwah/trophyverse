<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compare - Unified Achievement Manager</title>
<script src="/shared-theme.js"></script>
<link rel="stylesheet" href="/shared-theme.css" />
<style>
    .compare-form { display: flex; gap: 8px; margin-bottom: 24px; }
    .compare-form input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 9px 12px;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
    }

    .score-columns { display: flex; gap: 16px; margin-bottom: 24px; }
    .score-columns .score-card { flex: 1; min-width: 0; margin-bottom: 0; }

    .games-table { width: 100%; border-collapse: collapse; }
    .games-table th {
        text-align: left;
        font-size: 12px;
        color: var(--text-dim);
        font-weight: 600;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
    }
    .games-table th.side { text-align: center; }
    .games-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
    }
    .games-table td.side { text-align: center; color: var(--text-dim); white-space: nowrap; font-family: var(--font-mono); }
    .games-table td.side.ahead { color: var(--accent); font-weight: 700; }
    .games-table td.side.not-owned { opacity: 0.35; }
    .games-table tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
<header class="app-header">
    <h1>Unified Achievement Manager</h1>
    <nav>
        <a href="/leaderboard">Leaderboard</a>
        <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Switch to dark theme" title="Switch theme">
            <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.4 9.4A5.6 5.6 0 1 1 6.6 2.6a4.3 4.3 0 0 0 6.8 6.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
            <svg id="theme-icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="hidden"><circle cx="8" cy="8" r="3.3" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.2v1.7M8 13.1v1.7M14.8 8h-1.7M2.9 8H1.2M12.7 3.3l-1.2 1.2M4.5 11.5l-1.2 1.2M12.7 12.7l-1.2-1.2M4.5 4.5 3.3 3.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
    </nav>
</header>

<main>
    <form class="compare-form" id="compare-form">
        <input type="text" id="slug-a-input" placeholder="First profile slug" />
        <input type="text" id="slug-b-input" placeholder="Second profile slug" />
        <button type="submit">Compare</button>
    </form>

    <div id="result"></div>
</main>

<script>
async function fetchProfile(slug) {
    const [profileRes, gamesRes] = await Promise.all([
        fetch(`/api/public/${encodeURIComponent(slug)}`),
        fetch(`/api/public/${encodeURIComponent(slug)}/games`),
    ]);
    if (!profileRes.ok) return null;
    const profile = await profileRes.json();
    const games = gamesRes.ok ? await gamesRes.json() : [];
    return { slug, ...profile, games };
}

function scoreCard(profile, slug) {
    if (!profile) {
        return `<div class="score-card"><div class="score-info"><div class="username">"${slug}"</div><div class="points">No public profile with that name</div></div></div>`;
    }
    return `
        <div class="score-card">
            <div class="level-badge">
                <div class="n">${profile.score.level}</div>
                <div class="l">LEVEL</div>
            </div>
            <div class="score-info">
                <div class="username">${profile.username}</div>
                <div class="points">${profile.score.totalPoints.toLocaleString()} points</div>
            </div>
        </div>
    `;
}

function gamesTable(a, b) {
    const byId = new Map();
    for (const g of a?.games || []) byId.set(g.id, { title: g.title, a: g });
    for (const g of b?.games || []) {
        const row = byId.get(g.id) || { title: g.title };
        row.b = g;
        byId.set(g.id, row);
    }
    const rows = [...byId.values()].sort((x, y) => x.title.localeCompare(y.title));

    if (rows.length === 0) return `<div class="loading-note">Neither profile has any games synced yet.</div>`;

    const pct = (g) => (g && g.total_achievements > 0 ? g.unlocked_achievements / g.total_achievements : -1);
    const sideCell = (g) => {
        if (!g) return `<td class="side not-owned">-</td>`;
        return `<td class="side">${g.unlocked_achievements}/${g.total_achievements}</td>`;
    };

    return `
        <table class="games-table">
            <thead>
                <tr>
                    <th>Game</th>
                    <th class="side">${a ? a.username : "A"}</th>
                    <th class="side">${b ? b.username : "B"}</th>
                </tr>
            </thead>
            <tbody>
                ${rows
                    .map((r) => {
                        const aPct = pct(r.a);
                        const bPct = pct(r.b);
                        const aAhead = aPct > bPct;
                        const bAhead = bPct > aPct;
                        let aCell = sideCell(r.a);
                        let bCell = sideCell(r.b);
                        if (aAhead) aCell = aCell.replace('class="side"', 'class="side ahead"');
                        if (bAhead) bCell = bCell.replace('class="side"', 'class="side ahead"');
                        return `<tr><td>${r.title}</td>${aCell}${bCell}</tr>`;
                    })
                    .join("")}
            </tbody>
        </table>
    `;
}

async function runComparison(slugA, slugB) {
    const result = document.getElementById("result");
    result.innerHTML = `<div class="loading-note">Loading...</div>`;

    const [a, b] = await Promise.all([fetchProfile(slugA), fetchProfile(slugB)]);

    result.innerHTML = `
        <div class="score-columns">
            ${scoreCard(a, slugA)}
            ${scoreCard(b, slugB)}
        </div>
        ${a && b ? gamesTable(a, b) : `<div class="loading-note">Both profiles need to exist and be public to compare game libraries.</div>`}
    `;
}

document.getElementById("compare-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const a = document.getElementById("slug-a-input").value.trim();
    const b = document.getElementById("slug-b-input").value.trim();
    if (!a || !b) return;
    const url = new URL(location.href);
    url.searchParams.set("a", a);
    url.searchParams.set("b", b);
    history.replaceState(null, "", url);
    runComparison(a, b);
});

(function init() {
    initThemeToggle();

    const params = new URLSearchParams(location.search);
    const a = params.get("a");
    const b = params.get("b");
    if (a) document.getElementById("slug-a-input").value = a;
    if (b) document.getElementById("slug-b-input").value = b;
    if (a && b) runComparison(a, b);
})();
</script>
</body>
</html>
