<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leaderboard - Unified Achievement Manager</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #1b1e24;
        --card-hover: #22262e;
        --border: #2a2e37;
        --text: #e8e9ec;
        --text-dim: #9aa0ab;
        --accent: #6d8dfa;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
    }
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 20px; margin: 0; }
    header h1 span { color: var(--accent); }
    header a { color: var(--text-dim); font-size: 13px; text-decoration: none; }
    main { max-width: 640px; margin: 0 auto; padding: 24px; }

    .toolbar h2 { font-size: 15px; color: var(--text-dim); font-weight: 600; margin: 0 0 16px; }

    .board { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        text-decoration: none;
        color: var(--text);
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--card-hover); }
    .rank { width: 28px; flex-shrink: 0; font-weight: 700; color: var(--text-dim); text-align: right; }
    .rank.top1 { color: #f0c341; }
    .rank.top2 { color: #b8bec7; }
    .rank.top3 { color: #cd7f32; }
    .name { flex: 1; font-weight: 600; }
    .level { font-size: 12px; color: var(--text-dim); width: 60px; text-align: right; }
    .points { font-size: 13px; width: 110px; text-align: right; }

    .loading-note { color: var(--text-dim); font-size: 13px; padding: 16px; }
</style>
</head>
<body>

<header>
    <h1>Trophy<span>verse</span></h1>
    <div>
        <a href="/compare" style="margin-right: 16px;">Compare profiles</a>
        <a href="/">Back to dashboard →</a>
    </div>
</header>

<main>
    <div class="toolbar"><h2>Leaderboard</h2></div>
    <div class="board" id="board">
        <div class="loading-note">Loading...</div>
    </div>
</main>

<script>
async function api(path) {
    const res = await fetch(path, { credentials: "same-origin" });
    if (!res.ok) throw new Error(`${path} failed: ${res.status}`);
    return res.json();
}

function rankClass(i) {
    if (i === 0) return "rank top1";
    if (i === 1) return "rank top2";
    if (i === 2) return "rank top3";
    return "rank";
}

async function init() {
    const board = document.getElementById("board");
    let entries;
    try {
        entries = await api("/api/public/leaderboard");
    } catch (err) {
        board.innerHTML = `<div class="loading-note">Couldn't load the leaderboard: ${err.message}</div>`;
        return;
    }

    if (entries.length === 0) {
        board.innerHTML = `<div class="loading-note">No public profiles yet - be the first to opt in from your dashboard.</div>`;
        return;
    }

    board.innerHTML = entries
        .map(
            (entry, i) => `
        <a class="row" href="/u/${entry.public_slug}">
            <span class="${rankClass(i)}">${i + 1}</span>
            <span class="name">${entry.username}</span>
            <span class="level">LV ${entry.level}</span>
            <span class="points">${Number(entry.total_points).toLocaleString()} pts</span>
        </a>
    `
        )
        .join("");
}

init();
</script>
</body>
</html>
