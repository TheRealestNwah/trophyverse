<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trophyverse</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #1b1e24;
        --card-hover: #22262e;
        --border: #2a2e37;
        --text: #e8e9ec;
        --text-dim: #9aa0ab;
        --accent: #6d8dfa;
        --bronze: #cd7f32;
        --silver: #b8bec7;
        --gold: #f0c341;
        --platinum: #7dd3fc;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
    }
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 20px; margin: 0; }
    header h1 span { color: var(--accent); }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    .hidden { display: none !important; }

    button {
        background: var(--accent);
        color: #0b0d10;
        border: none;
        padding: 9px 16px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
    }

    #signin-view { text-align: center; padding: 80px 24px; }
    #signin-view p { color: var(--text-dim); margin-bottom: 24px; }

    .score-card {
        display: flex;
        align-items: center;
        gap: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 24px;
    }
    .level-badge {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #a06dfa);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .level-badge .n { font-size: 24px; font-weight: 700; line-height: 1; }
    .level-badge .l { font-size: 9px; letter-spacing: 1px; opacity: 0.85; }
    .score-info { flex: 1; }
    .score-info .points { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }
    .progress-track {
        background: #0b0d10;
        border-radius: 4px;
        height: 8px;
        overflow: hidden;
    }
    .progress-fill {
        background: linear-gradient(90deg, var(--accent), #a06dfa);
        height: 100%;
    }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .toolbar h2 { font-size: 15px; color: var(--text-dim); font-weight: 600; margin: 0; }

    .platforms { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .platform-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
    }
    .platform-name { font-weight: 600; width: 70px; flex-shrink: 0; }
    .platform-note { font-size: 12px; color: var(--text-dim); flex: 1; }
    .platform-row input[type="text"] {
        flex: 1;
        background: #0b0d10;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        color: var(--text);
        font-size: 13px;
    }
    .platform-badge {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-dim);
        background: #0b0d10;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
    }

    .game {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        overflow: hidden;
    }
    .game-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        cursor: pointer;
    }
    .game-row:hover { background: var(--card-hover); }
    .game-title { flex: 1; font-weight: 600; }
    .game-progress-text { font-size: 13px; color: var(--text-dim); width: 90px; text-align: right; }
    .tier-pips { display: flex; gap: 6px; font-size: 12px; }
    .pip { display: flex; align-items: center; gap: 3px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.platinum { background: var(--platinum); }
    .dot.gold { background: var(--gold); }
    .dot.silver { background: var(--silver); }
    .dot.bronze { background: var(--bronze); }

    .achievements { border-top: 1px solid var(--border); padding: 8px 16px; }
    .achievement {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
    }
    .achievement:last-child { border-bottom: none; }
    .achievement.locked { opacity: 0.45; }
    .tier-tag {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 4px;
        color: #0b0d10;
        flex-shrink: 0;
        width: 56px;
        text-align: center;
    }
    .tier-tag.platinum { background: var(--platinum); }
    .tier-tag.gold { background: var(--gold); }
    .tier-tag.silver { background: var(--silver); }
    .tier-tag.bronze { background: var(--bronze); }
    .achievement-body { flex: 1; min-width: 0; }
    .achievement-name { font-weight: 600; font-size: 14px; }
    .achievement-desc { font-size: 12px; color: var(--text-dim); }
    .achievement-rarity { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

    .loading-note { color: var(--text-dim); font-size: 13px; padding: 16px; }

    .review-list {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 16px;
    }
    .review-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
    }
    .review-row:last-child { border-bottom: none; }
    .review-game { font-size: 11px; color: var(--text-dim); width: 110px; flex-shrink: 0; }
    .review-compare { flex: 1; font-size: 13px; min-width: 0; }
    .review-compare .arrow { color: var(--text-dim); margin: 0 6px; }
    .review-confidence { font-size: 11px; color: var(--text-dim); width: 50px; flex-shrink: 0; text-align: right; }
    .review-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .review-actions button { padding: 5px 10px; font-size: 12px; }
    .review-actions button.reject { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
</style>
</head>
<body>

<header>
    <h1>Trophy<span>verse</span></h1>
    <div id="header-actions"></div>
</header>

<main>
    <section id="signin-view" class="hidden">
        <p>Connect your Steam account to see your achievements in one place.</p>
        <a href="/auth/steam"><button>Sign in with Steam</button></a>
    </section>

    <section id="dashboard-view" class="hidden">
        <div class="score-card">
            <div class="level-badge">
                <div class="n" id="level-number">-</div>
                <div class="l">LEVEL</div>
            </div>
            <div class="score-info">
                <div class="points" id="points-text">-</div>
                <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
            </div>
        </div>

        <div class="platforms" id="platforms-list"></div>
        <p class="loading-note" style="margin: -8px 0 20px;">
            PSN has no public login - to connect it, log into
            <a href="https://www.playstation.com" target="_blank" style="color: var(--accent);">playstation.com</a>,
            then visit
            <a href="https://ca.account.sony.com/api/v1/ssocookie" target="_blank" style="color: var(--accent);">this page</a>
            in the same browser and copy the <code>npsso</code> value from the JSON it shows.
        </p>

        <div class="toolbar">
            <h2 id="games-heading">Your games</h2>
            <div>
                <span class="platform-note" id="match-status"></span>
                <button class="secondary" id="review-btn">Review matches</button>
                <button class="secondary" id="match-btn">Find matches</button>
            </div>
        </div>

        <div id="review-panel" class="hidden"></div>

        <div id="games-list"></div>
    </section>
</main>

<script>
const state = { games: [] };

async function api(path, options) {
    const res = await fetch(path, { credentials: "same-origin", ...options });
    if (res.status === 401) throw new Error("unauthenticated");
    if (!res.ok) {
        const body = await res.json().catch(() => null);
        throw new Error(body?.error || `${path} failed: ${res.status}`);
    }
    if (res.status === 204) return null;
    return res.json();
}

function tierDots(game) {
    const tiers = [
        ["platinum", game.platinum_unlocked],
        ["gold", game.gold_unlocked],
        ["silver", game.silver_unlocked],
        ["bronze", game.bronze_unlocked],
    ];
    return tiers
        .filter(([, count]) => Number(count) > 0)
        .map(([tier, count]) => `<span class="pip"><span class="dot ${tier}"></span>${count}</span>`)
        .join("");
}

function renderScore(score) {
    document.getElementById("level-number").textContent = score.level;
    document.getElementById("points-text").textContent =
        `${score.totalPoints.toLocaleString()} points` +
        (score.pointsForNextLevel != null
            ? ` — ${(score.pointsForNextLevel - score.totalPoints).toLocaleString()} to level ${score.level + 1}`
            : " — max level");

    const span = score.pointsForNextLevel != null ? score.pointsForNextLevel - score.pointsForCurrentLevel : 1;
    const progressed = score.totalPoints - score.pointsForCurrentLevel;
    const pct = score.pointsForNextLevel != null ? Math.min(100, (progressed / span) * 100) : 100;
    document.getElementById("progress-fill").style.width = `${pct}%`;
}

function platformBadges(game) {
    return (game.platforms || [])
        .map((p) => `<span class="platform-badge">${p}</span>`)
        .join("");
}

function renderGames(games) {
    document.getElementById("games-heading").textContent =
        `Your games (${games.length})`;

    const list = document.getElementById("games-list");
    list.innerHTML = "";
    for (const game of games) {
        const el = document.createElement("div");
        el.className = "game";
        el.innerHTML = `
            <div class="game-row" data-game-id="${game.id}">
                <div class="game-title">${game.title}</div>
                ${platformBadges(game)}
                <div class="tier-pips">${tierDots(game)}</div>
                <div class="game-progress-text">${game.unlocked_achievements}/${game.total_achievements}</div>
            </div>
        `;
        el.querySelector(".game-row").addEventListener("click", () => toggleAchievements(el, game.id));
        list.appendChild(el);
    }
}

async function toggleAchievements(gameEl, gameId) {
    const existing = gameEl.querySelector(".achievements");
    if (existing) {
        existing.remove();
        return;
    }
    const panel = document.createElement("div");
    panel.className = "achievements";
    panel.innerHTML = `<div class="loading-note">Loading achievements...</div>`;
    gameEl.appendChild(panel);

    const achievements = await api(`/api/me/games/${gameId}/achievements`);
    panel.innerHTML = achievements
        .map(
            (a) => `
        <div class="achievement ${a.unlocked ? "" : "locked"}">
            <span class="tier-tag ${a.tier}">${a.tier}</span>
            <div class="achievement-body">
                <div class="achievement-name">${a.name}</div>
                ${a.description ? `<div class="achievement-desc">${a.description}</div>` : ""}
            </div>
            <div class="achievement-rarity">${a.global_unlock_rarity != null ? Number(a.global_unlock_rarity).toFixed(1) + "%" : ""}</div>
        </div>
    `
        )
        .join("");
}

async function refreshGamesAndScore() {
    const [score, games] = await Promise.all([api("/api/me/score"), api("/api/me/games")]);
    renderScore(score);
    renderGames(games);
}

async function refreshReviewCount() {
    const candidates = await api("/api/matching/candidates");
    const btn = document.getElementById("review-btn");
    btn.textContent = candidates.length > 0 ? `Review matches (${candidates.length})` : "Review matches";
    return candidates;
}

function renderReviewPanel(candidates) {
    const panel = document.getElementById("review-panel");
    if (candidates.length === 0) {
        panel.innerHTML = `<div class="loading-note">No matches waiting for review.</div>`;
        return;
    }

    panel.innerHTML = candidates
        .map(
            (c) => `
        <div class="review-row" data-id="${c.id}">
            <span class="review-game">${c.game_title}</span>
            <span class="review-compare">
                <span class="platform-badge">${c.candidate_platform}</span> ${c.candidate_name}
                <span class="arrow">vs</span>
                ${(c.target_platforms || []).map((p) => `<span class="platform-badge">${p}</span>`).join(" ")}
                ${c.target_name} <span class="tier-tag ${c.target_tier}">${c.target_tier}</span>
            </span>
            <span class="review-confidence">${Math.round(c.confidence * 100)}%</span>
            <span class="review-actions">
                <button class="confirm">Same</button>
                <button class="reject">Different</button>
            </span>
        </div>
    `
        )
        .join("");

    panel.querySelectorAll(".review-row").forEach((row) => {
        const id = row.dataset.id;
        row.querySelector(".confirm").addEventListener("click", () => resolveCandidate(id, "confirm"));
        row.querySelector(".reject").addEventListener("click", () => resolveCandidate(id, "reject"));
    });
}

async function resolveCandidate(id, action) {
    await api(`/api/matching/candidates/${id}/${action}`, { method: "POST" });
    const candidates = await refreshReviewCount();
    renderReviewPanel(candidates);
    if (action === "confirm") await refreshGamesAndScore();
}

async function syncPlatform(platformId, button, noteEl) {
    button.disabled = true;
    noteEl.textContent = platformId === "steam"
        ? "Syncing... this can take a few minutes for a large library."
        : "Syncing...";
    try {
        const summary = await api(`/api/${platformId}/sync`, { method: "POST" });
        noteEl.textContent = `Synced ${summary.gamesProcessed} games, ${summary.achievementsUnlocked} new unlocks.`;
        renderScore(summary.score);
        await refreshGamesAndScore();
    } catch (err) {
        noteEl.textContent = err.message?.includes("429") || err.message?.toLowerCase().includes("rate limit")
            ? "Rate limited by Xbox's API — wait a bit and try again."
            : `Sync failed: ${err.message}`;
        console.error(err);
    } finally {
        button.disabled = false;
    }
}

function renderPlatforms(accounts) {
    const byPlatform = Object.fromEntries(accounts.map((a) => [a.platform_id, a]));
    const list = document.getElementById("platforms-list");
    list.innerHTML = "";

    // Steam is always connected here - it's how you signed in.
    const steamRow = document.createElement("div");
    steamRow.className = "platform-row";
    steamRow.innerHTML = `
        <span class="platform-name">Steam</span>
        <span class="platform-note" id="steam-note">${
            byPlatform.steam?.last_synced_at
                ? `Last synced ${new Date(byPlatform.steam.last_synced_at).toLocaleString()}`
                : "Not synced yet"
        }</span>
        <button id="steam-sync-btn">Sync</button>
    `;
    list.appendChild(steamRow);
    steamRow.querySelector("#steam-sync-btn").addEventListener("click", (e) =>
        syncPlatform("steam", e.target, steamRow.querySelector("#steam-note"))
    );

    const xboxRow = document.createElement("div");
    xboxRow.className = "platform-row";
    if (byPlatform.xbox) {
        xboxRow.innerHTML = `
            <span class="platform-name">Xbox</span>
            <span class="platform-note" id="xbox-note">${byPlatform.xbox.display_name} — ${
                byPlatform.xbox.last_synced_at
                    ? `last synced ${new Date(byPlatform.xbox.last_synced_at).toLocaleString()}`
                    : "not synced yet"
            }</span>
            <button id="xbox-sync-btn">Sync</button>
        `;
        list.appendChild(xboxRow);
        xboxRow.querySelector("#xbox-sync-btn").addEventListener("click", (e) =>
            syncPlatform("xbox", e.target, xboxRow.querySelector("#xbox-note"))
        );
    } else {
        xboxRow.innerHTML = `
            <span class="platform-name">Xbox</span>
            <input type="text" id="xbox-key-input" placeholder="Paste your OpenXBL API key (from xbl.io/dashboard)" />
            <button id="xbox-connect-btn">Connect</button>
        `;
        list.appendChild(xboxRow);
        xboxRow.querySelector("#xbox-connect-btn").addEventListener("click", async () => {
            const input = xboxRow.querySelector("#xbox-key-input");
            const btn = xboxRow.querySelector("#xbox-connect-btn");
            btn.disabled = true;
            try {
                await api("/api/xbox/connect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ apiKey: input.value.trim() }),
                });
                await refreshPlatforms();
            } catch (err) {
                alert("Couldn't connect that Xbox account. Double check the API key.");
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        });
    }

    const psnRow = document.createElement("div");
    psnRow.className = "platform-row";
    if (byPlatform.psn) {
        psnRow.innerHTML = `
            <span class="platform-name">PSN</span>
            <span class="platform-note" id="psn-note">${byPlatform.psn.display_name} — ${
                byPlatform.psn.last_synced_at
                    ? `last synced ${new Date(byPlatform.psn.last_synced_at).toLocaleString()}`
                    : "not synced yet"
            }</span>
            <button id="psn-sync-btn">Sync</button>
        `;
        list.appendChild(psnRow);
        psnRow.querySelector("#psn-sync-btn").addEventListener("click", (e) =>
            syncPlatform("psn", e.target, psnRow.querySelector("#psn-note"))
        );
    } else {
        psnRow.innerHTML = `
            <span class="platform-name">PSN</span>
            <input type="text" id="psn-key-input" placeholder="Paste your NPSSO token" />
            <button id="psn-connect-btn">Connect</button>
        `;
        list.appendChild(psnRow);
        psnRow.querySelector("#psn-connect-btn").addEventListener("click", async () => {
            const input = psnRow.querySelector("#psn-key-input");
            const btn = psnRow.querySelector("#psn-connect-btn");
            btn.disabled = true;
            try {
                await api("/api/psn/connect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ npsso: input.value.trim() }),
                });
                await refreshPlatforms();
            } catch (err) {
                alert(err.message || "Couldn't connect that PlayStation account.");
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        });
    }
}

async function refreshPlatforms() {
    renderPlatforms(await api("/api/me/accounts"));
}

async function init() {
    let user;
    try {
        user = await api("/auth/me");
    } catch {
        document.getElementById("signin-view").classList.remove("hidden");
        return;
    }

    document.getElementById("dashboard-view").classList.remove("hidden");
    document.getElementById("header-actions").innerHTML = `
        <span style="color: var(--text-dim); margin-right: 12px;">${user.username}</span>
        <button class="secondary" id="logout-btn">Log out</button>
    `;
    document.getElementById("logout-btn").addEventListener("click", async () => {
        await fetch("/auth/logout", { method: "POST" });
        location.reload();
    });
    document.getElementById("match-btn").addEventListener("click", async (e) => {
        const btn = e.target;
        const status = document.getElementById("match-status");
        btn.disabled = true;
        status.textContent = "Matching games and achievements across platforms...";
        try {
            const summary = await api("/api/matching/run", { method: "POST" });
            status.textContent = `Merged ${summary.gameGroupsMerged} game(s), ${summary.achievementsMerged} achievement(s). ${summary.achievementCandidatesRecorded} possible match(es) queued for review.`;
            await refreshGamesAndScore();
            await refreshReviewCount();
        } catch (err) {
            status.textContent = `Matching failed: ${err.message}`;
        } finally {
            btn.disabled = false;
        }
    });
    document.getElementById("review-btn").addEventListener("click", async () => {
        const panel = document.getElementById("review-panel");
        if (!panel.classList.contains("hidden")) {
            panel.classList.add("hidden");
            return;
        }
        panel.classList.remove("hidden");
        panel.className = "review-list";
        panel.innerHTML = `<div class="loading-note">Loading...</div>`;
        renderReviewPanel(await api("/api/matching/candidates"));
    });

    await refreshPlatforms();
    await refreshGamesAndScore();
    await refreshReviewCount();
}

init();
</script>
</body>
</html>
